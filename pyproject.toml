[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kelbet-ai"
version = "0.3.0"
description = "KELBET AI — bilingual Telegram AI service for Kazakhstan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "redis>=5.2,<6",
    "httpx>=0.28,<1",
    "boto3>=1.35,<2",
    "arq>=0.26,<1",
    "prometheus-client>=0.21,<1",
    "sentry-sdk[fastapi]>=2.20,<3",
    "pillow>=11.1,<13",
    "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-redis",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/kelbet", "apps"]

[tool.hatch.build.targets.wheel.sources]
"packages/kelbet" = "kelbet"
"apps" = "apps"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "packages"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"apps/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages"
files = ["apps", "packages", "tests"]
warn_unused_configs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "aiogram.*",
    "asyncpg.*",
    "boto3.*",
    "botocore.*",
    "arq.*",
    "PIL.*",
    "imageio_ffmpeg.*",
]
ignore_missing_imports = true
