name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kelbet
          POSTGRES_PASSWORD: kelbet
          POSTGRES_DB: kelbet_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kelbet -d kelbet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@localhost:5433/kelbet_test
      BOT_TOKEN: "999:CI-TOKEN"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check apps packages tests scripts
      - name: Mypy
        run: mypy apps packages
      - name: Pytest
        run: pytest -q
      - name: OpenAPI drift check
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/openapi/v1.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
