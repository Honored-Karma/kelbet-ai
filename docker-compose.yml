services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kelbet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kelbet}
      POSTGRES_DB: ${POSTGRES_DB:-kelbet}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kelbet} -d ${POSTGRES_DB:-kelbet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["python", "-m", "apps.api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      GENERATION_QUEUE_BACKEND: arq
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["python", "-m", "apps.bot"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m apps.bot' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["arq", "apps.worker.main.ImageWorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
      REDIS_URL: redis://redis:6379/0
      GENERATION_QUEUE_BACKEND: arq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq apps.worker.main.ImageWorkerSettings' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-text:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["arq", "apps.worker.main.TextWorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
      REDIS_URL: redis://redis:6379/0
      GENERATION_QUEUE_BACKEND: arq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq apps.worker.main.TextWorkerSettings' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-video:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["arq", "apps.worker.main.VideoWorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
      REDIS_URL: redis://redis:6379/0
      GENERATION_QUEUE_BACKEND: arq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq apps.worker.main.VideoWorkerSettings' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-maintain:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: ["arq", "apps.worker.main.MaintainWorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kelbet:kelbet@postgres:5432/kelbet
      REDIS_URL: redis://redis:6379/0
      GENERATION_QUEUE_BACKEND: arq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq apps.worker.main.MaintainWorkerSettings' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-kelbet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-kelbetkelbet}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
